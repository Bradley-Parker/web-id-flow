<h2 class="tool-stage-heading">Remove Image Backgrounds Online</h2>

<div class="tool-container">
  <div class="img-preview" id="dropZone" onclick="document.getElementById('imgFile').click()">
    <div id="imgPlaceholder">
      <p style="font-size:18px;color:#999;margin:0">Drop an image here or click to upload</p>
      <p style="font-size:13px;color:#bbb">Works best on photos with a clear subject</p>
    </div>
    <img id="imgPreview" style="display:none">
    <input type="file" id="imgFile" accept="image/*" style="display:none" onchange="loadImage(this)">
  </div>

  <div class="img-stats" id="imgStats"></div>

  <div id="controls" style="display:none">
    <div class="tool-group">
      <label class="tool-label">Model</label>
      <select id="model" class="tool-select">
        <option value="fast" selected>Fast (5 MB download)</option>
        <option value="quality">High quality (43 MB download)</option>
      </select>
    </div>

    <div class="tool-group">
      <label class="tool-label">New Background</label>
      <div class="tool-options">
        <label class="tool-option"><input type="radio" name="bgMode" value="transparent" checked> Transparent</label>
        <label class="tool-option"><input type="radio" name="bgMode" value="white"> White</label>
        <label class="tool-option"><input type="radio" name="bgMode" value="color"> Color:
          <input type="color" id="bgColor" value="#04AA6D"></label>
      </div>
    </div>

    <div class="tool-options" style="margin-top:8px">
      <button class="tool-btn" id="removeBtn" onclick="removeBackground()">Remove Background</button>
      <button class="tool-btn tool-btn-secondary" onclick="resetTool()">New Image</button>
    </div>
    <div class="progress-bar" id="progBar"><div id="progFill"></div></div>
    <div id="status" style="margin-top:10px"></div>

    <div class="bg-result" id="result" style="display:none">
      <canvas id="outCanvas"></canvas>
      <div class="tool-options" style="margin-top:10px;justify-content:center">
        <button class="tool-btn" onclick="downloadResult()">Download PNG</button>
      </div>
    </div>
  </div>
</div>




</script>
<!--[if lt IE 9]>
<script src="https://oss.maxcdn.com/libs/html5shiv/3.7.0/html5shiv.js"></script>
<script src="https://oss.maxcdn.com/libs/respond.js/1.4.2/respond.min.js"></script>
<![endif]-->
<script src="https://cdn.jsdelivr.net/npm/onnxruntime-web@1.18.0/dist/ort.min.js"></script>
<script>
/* GitHub release assets block cross-origin fetch, so the models are loaded
   from a Hugging Face mirror of the same rembg model files */
var MODELS = {
  fast:    {url: 'https://huggingface.co/tomjackson2023/rembg/resolve/main/u2netp.onnx',  size: 4574861},
  quality: {url: 'https://huggingface.co/tomjackson2023/rembg/resolve/main/silueta.onnx', size: 44173029}
};
var INPUT_SIZE = 320;
var sessions = {};
var originalImg = null, srcName = 'image';
var dropZone = document.getElementById('dropZone');

if (typeof ort !== 'undefined'){
  ort.env.wasm.wasmPaths = 'https://cdn.jsdelivr.net/npm/onnxruntime-web@1.18.0/dist/';
}

dropZone.addEventListener('dragover', function(e){ e.preventDefault(); dropZone.classList.add('dragover'); });
dropZone.addEventListener('dragleave', function(){ dropZone.classList.remove('dragover'); });
dropZone.addEventListener('drop', function(e){
  e.preventDefault(); dropZone.classList.remove('dragover');
  if (e.dataTransfer.files.length){ document.getElementById('imgFile').files = e.dataTransfer.files; loadImage(document.getElementById('imgFile')); }
});

function fmtSize(b){ return b > 1048576 ? (b/1048576).toFixed(2)+' MB' : (b/1024).toFixed(1)+' KB'; }
function setStatus(html){ document.getElementById('status').innerHTML = html; }
function setProgress(p){
  document.getElementById('progBar').style.display = p === null ? 'none' : 'block';
  document.getElementById('progFill').style.width = p === null ? '0' : Math.round(p*100)+'%';
}

function loadImage(input){
  var file = input.files[0];
  if (!file) return;
  srcName = file.name.replace(/\.[^.]+$/, '');
  var reader = new FileReader();
  reader.onload = function(e){
    var img = new Image();
    img.onload = function(){
      originalImg = img;
      document.getElementById('imgPreview').src = e.target.result;
      document.getElementById('imgPreview').style.display = 'block';
      document.getElementById('imgPlaceholder').style.display = 'none';
      document.getElementById('controls').style.display = 'block';
      document.getElementById('imgStats').innerHTML = 'Source: <span>'+file.name+'</span> | Size: <span>'+fmtSize(file.size)+'</span> | Dimensions: <span>'+img.naturalWidth+' &times; '+img.naturalHeight+'</span>';
      document.getElementById('result').style.display = 'none';
      setStatus('');
    };
    img.onerror = function(){
      document.getElementById('imgStats').innerHTML = '<span class="tool-error">Could not read this image file.</span>';
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

/* download the model with progress, using the browser Cache API for repeat visits */
async function fetchModel(key){
  var model = MODELS[key];
  var cache = null;
  try { cache = await caches.open('w3s-bg-removal-models'); } catch(e){ /* private mode */ }
  if (cache){
    var hit = await cache.match(model.url);
    if (hit) return await hit.arrayBuffer();
  }
  var resp = await fetch(model.url);
  if (!resp.ok) throw new Error('Model download failed (HTTP '+resp.status+').');
  var reader = resp.body.getReader();
  var total = parseInt(resp.headers.get('Content-Length')) || model.size;
  var received = 0, chunks = [];
  while (true){
    var r = await reader.read();
    if (r.done) break;
    chunks.push(r.value);
    received += r.value.length;
    setProgress(Math.min(1, received/total));
    setStatus('<p class="tool-info">Downloading model&hellip; '+fmtSize(received)+' of '+fmtSize(total)+'</p>');
  }
  var buf = new Uint8Array(received), off = 0;
  chunks.forEach(function(c){ buf.set(c, off); off += c.length; });
  if (cache){
    try { await cache.put(model.url, new Response(buf.buffer.slice(0), {headers:{'Content-Type':'application/octet-stream'}})); } catch(e){}
  }
  return buf.buffer;
}

async function getSession(key){
  if (sessions[key]) return sessions[key];
  var buf = await fetchModel(key);
  setProgress(null);
  setStatus('<p class="tool-info">Preparing model&hellip;</p>');
  sessions[key] = await ort.InferenceSession.create(buf, {executionProviders: ['wasm']});
  return sessions[key];
}

/* u2net family preprocessing: stretch to 320x320, normalize with ImageNet mean/std */
function preprocess(img){
  var c = document.createElement('canvas');
  c.width = INPUT_SIZE; c.height = INPUT_SIZE;
  var ctx = c.getContext('2d');
  ctx.drawImage(img, 0, 0, INPUT_SIZE, INPUT_SIZE);
  var d = ctx.getImageData(0, 0, INPUT_SIZE, INPUT_SIZE).data;
  var n = INPUT_SIZE*INPUT_SIZE;
  var f = new Float32Array(3*n);
  var mean = [0.485, 0.456, 0.406], std = [0.229, 0.224, 0.225];
  // find max channel value for u2net-style scaling
  var maxV = 0;
  for (var i = 0; i < d.length; i++){ if (i % 4 !== 3 && d[i] > maxV) maxV = d[i]; }
  if (maxV === 0) maxV = 255;
  for (var p = 0; p < n; p++){
    for (var ch = 0; ch < 3; ch++){
      f[ch*n + p] = (d[p*4 + ch]/maxV - mean[ch]) / std[ch];
    }
  }
  return new ort.Tensor('float32', f, [1, 3, INPUT_SIZE, INPUT_SIZE]);
}

async function removeBackground(){
  if (!originalImg) return;
  if (typeof ort === 'undefined'){
    setStatus('<p class="tool-error">The AI runtime could not be loaded. Check your internet connection and reload the page.</p>');
    return;
  }
  var btn = document.getElementById('removeBtn');
  btn.disabled = true;
  try {
    var session = await getSession(document.getElementById('model').value);
    setProgress(null);
    setStatus('<p class="tool-info">Removing background&hellip;</p>');
    await new Promise(function(r){ setTimeout(r, 30); }); // let the status paint before blocking

    var feeds = {};
    feeds[session.inputNames[0]] = preprocess(originalImg);
    var results = await session.run(feeds);
    var out = results[session.outputNames[0]].data;

    // min-max normalize the predicted mask
    var mn = Infinity, mx = -Infinity;
    for (var i = 0; i < out.length; i++){ if (out[i] < mn) mn = out[i]; if (out[i] > mx) mx = out[i]; }
    var range = mx - mn || 1;

    // write the mask into a small canvas, then let the browser scale it up smoothly
    var maskSmall = document.createElement('canvas');
    maskSmall.width = INPUT_SIZE; maskSmall.height = INPUT_SIZE;
    var mctx = maskSmall.getContext('2d');
    var mimg = mctx.createImageData(INPUT_SIZE, INPUT_SIZE);
    for (i = 0; i < INPUT_SIZE*INPUT_SIZE; i++){
      var v = Math.round(((out[i] - mn) / range) * 255);
      mimg.data[i*4] = mimg.data[i*4+1] = mimg.data[i*4+2] = v;
      mimg.data[i*4+3] = 255;
    }
    mctx.putImageData(mimg, 0, 0);

    var w = originalImg.naturalWidth, h = originalImg.naturalHeight;
    var maskFull = document.createElement('canvas');
    maskFull.width = w; maskFull.height = h;
    var mfctx = maskFull.getContext('2d');
    mfctx.imageSmoothingEnabled = true;
    mfctx.imageSmoothingQuality = 'high';
    mfctx.drawImage(maskSmall, 0, 0, w, h);
    var maskData = mfctx.getImageData(0, 0, w, h).data;

    var outCanvas = document.getElementById('outCanvas');
    outCanvas.width = w; outCanvas.height = h;
    var octx = outCanvas.getContext('2d');
    octx.drawImage(originalImg, 0, 0);
    var outImg = octx.getImageData(0, 0, w, h);
    for (i = 0; i < w*h; i++){
      outImg.data[i*4+3] = maskData[i*4];
    }
    octx.putImageData(outImg, 0, 0);

    var bgMode = document.querySelector('input[name="bgMode"]:checked').value;
    if (bgMode !== 'transparent'){
      var composed = document.createElement('canvas');
      composed.width = w; composed.height = h;
      var cctx = composed.getContext('2d');
      cctx.fillStyle = bgMode === 'white' ? '#ffffff' : document.getElementById('bgColor').value;
      cctx.fillRect(0, 0, w, h);
      cctx.drawImage(outCanvas, 0, 0);
      octx.clearRect(0, 0, w, h);
      octx.drawImage(composed, 0, 0);
    }

    document.getElementById('result').style.display = 'block';
    setStatus('<p class="tool-success">Background removed. Review the result below, then download.</p>');
  } catch(err){
    setStatus('<p class="tool-error">Background removal failed: ' + err.message + '</p>');
  }
  setProgress(null);
  btn.disabled = false;
}

function downloadResult(){
  document.getElementById('outCanvas').toBlob(function(blob){
    var link = document.createElement('a');
    link.download = srcName + '_no_bg.png';
    link.href = URL.createObjectURL(blob);
    link.click();
    setTimeout(function(){ URL.revokeObjectURL(link.href); }, 4000);
  }, 'image/png');
}

function resetTool(){
  document.getElementById('imgFile').value = '';
  originalImg = null;
  document.getElementById('imgPreview').style.display = 'none';
  document.getElementById('imgPlaceholder').style.display = 'block';
  document.getElementById('controls').style.display = 'none';
  document.getElementById('imgStats').innerHTML = '';
  document.getElementById('result').style.display = 'none';
  setStatus('');
}
</script>

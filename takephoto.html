<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ID Photo Capture</title>
    <style>
        :root {
            --primary-color: #0076d6;
            --background-color: #f5f7fa;
            --container-bg: #ffffff;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--background-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        .container {
            background: var(--container-bg);
            padding: 24px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            text-align: center;
            max-width: 500px;
            width: 100%;
        }

        h2 {
            margin-top: 0;
            color: #333;
            font-size: 1.5rem;
        }

        p {
            color: #666;
            font-size: 0.9rem;
            margin-bottom: 20px;
        }

        .camera-wrapper {
            position: relative;
            width: 400px;
            height: 500px;
            /* Standard 4:5 ID photo aspect ratio */
            margin: 0 auto 20px auto;
            border-radius: 8px;
            overflow: hidden;
            background: #000;
            box-shadow: inset 0 0 20px rgba(0, 0, 0, 0.5);
        }

        /* Mirror the video for natural human movement */
        #video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scaleX(-1);
        }

        /* Overlay alignment guides */
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            /* Allows clicking through if needed */
        }

        .controls {
            display: flex;
            justify-content: center;
            gap: 12px;
        }

        button {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s, opacity 0.2s;
        }

        button:hover {
            background-color: #005eb1;
        }

        button:disabled {
            background-color: #ccc;
            cursor: not-allowed;
        }

        #snap-btn {
            background-color: #10b981;
        }

        #snap-btn:hover {
            background-color: #059669;
        }

        #preview-container {
            margin-top: 20px;
            display: none;
        }

        #preview-canvas {
            max-width: 100%;
            height: auto;
            border-radius: 8px;
            border: 2px solid #ddd;
            /* Mirror the final output to match what the user saw */
            transform: scaleX(-1);
        }

        .download-link {
            display: inline-block;
            margin-top: 12px;
            color: var(--primary-color);
            text-decoration: none;
            font-weight: 600;
        }

        .download-link:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

    <div class="container">
        <h2>ID Photo Capture</h2>
        <p>Align your eyes with the blue dashed line. Fit your head and shoulders inside the outline.</p>

        <div class="camera-wrapper">
            <video id="video" autoplay playsinline></video>

            <!-- SVG Alignment Overlay -->
            <svg class="overlay" viewBox="0 0 400 500" xmlns="http://w3.org">
                <!-- Semi-transparent mask outside the frame boundary if desired, 
                 or simply clear geometric guides -->

                <!-- Head Outline (Egg Shape/Ellipse) -->
                <ellipse cx="200" cy="210" rx="75" ry="105" fill="none" stroke="#0076d6" stroke-width="3"
                    stroke-dasharray="8,4" opacity="0.85" />

                <!-- Eye Alignment Line -->
                <line x1="100" y1="180" x2="300" y2="180" stroke="#0076d6" stroke-width="2" stroke-dasharray="4,4"
                    opacity="0.7" />

                <!-- Shoulders Guide -->
                <path d="M 80 430 C 100 360, 120 330, 200 330 C 280 330, 300 360, 320 430" fill="none" stroke="#0076d6"
                    stroke-width="3" stroke-dasharray="8,4" opacity="0.85" />

                <!-- Center Vertical Axis -->
                <line x1="200" y1="50" x2="200" y2="450" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="2,4"
                    opacity="0.5" />
            </svg>
        </div>

        <div class="controls">
            <button id="start-btn">Start Camera</button>
            <button id="snap-btn" disabled>Take Photo</button>
        </div>

        <div id="preview-container">
            <h3>Captured Photo Preview</h3>
            <canvas id="preview-canvas" width="400" height="500"></canvas>
            <br>
            <a id="download-btn" class="download-link" href="#" download="id_photo.png">Download Photo</a>
        </div>
    </div>

    <script>
        const video = document.getElementById('video');
        const canvas = document.getElementById('preview-canvas');
        const startBtn = document.getElementById('start-btn');
        const snapBtn = document.getElementById('snap-btn');
        const previewContainer = document.getElementById('preview-container');
        const downloadBtn = document.getElementById('download-btn');
        const ctx = canvas.getContext('2d');

        let stream = null;

        // 1. Request access to webcam
        async function startCamera() {
            try {
                // Request ideal 4:5 aspect ratio constraints matching our viewport
                stream = await navigator.mediaDevices.getUserMedia({
                    video: {
                        width: { ideal: 1280 },
                        height: { ideal: 960 },
                        facingMode: "user"
                    },
                    audio: false
                });
                video.srcObject = stream;
                startBtn.disabled = true;
                snapBtn.disabled = false;
            } catch (err) {
                console.error("Error accessing camera: ", err);
                alert("Could not access webcam. Ensure you are on HTTPS or localhost, and have granted camera permissions.");
            }
        }

        // 2. Capture frame from video stream
        function takePhoto() {
            // Clear previous canvas data
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Handle mirroring the canvas output to match live mirrored preview
            ctx.translate(canvas.width, 0);
            ctx.scale(-1, 1);

            // Calculate aspect ratios to "cover" the target canvas size cleanly
            const videoWidth = video.videoWidth;
            const videoHeight = video.videoHeight;
            const targetWidth = canvas.width;
            const targetHeight = canvas.height;

            const videoAspect = videoWidth / videoHeight;
            const targetAspect = targetWidth / targetHeight;

            let sourceX = 0, sourceY = 0, sourceWidth = videoWidth, sourceHeight = videoHeight;

            if (videoAspect > targetAspect) {
                sourceWidth = videoHeight * targetAspect;
                sourceX = (videoWidth - sourceWidth) / 2;
            } else {
                sourceHeight = videoWidth / targetAspect;
                sourceY = (videoHeight - sourceHeight) / 2;
            }

            // Draw video frame to hidden/preview canvas
            ctx.drawImage(video, sourceX, sourceY, sourceWidth, sourceHeight, 0, 0, targetWidth, targetHeight);

            // Reset transformation matrix back to normal
            ctx.setTransform(1, 0, 0, 1, 0, 0);

            // Show layout components
            previewContainer.style.display = 'block';

            // Prepare the download link
            const dataUrl = canvas.toDataURL('image/png');
            downloadBtn.href = dataUrl;

            // Scroll down to preview smoothly
            previewContainer.scrollIntoView({ behavior: 'smooth' });
        }

        // Event Listeners
        startBtn.addEventListener('click', startCamera);
        snapBtn.addEventListener('click', takePhoto);
    </script>

</body>

</html>
